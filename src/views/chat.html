<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <style>
        .panel-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            gap: 40px;
        }

        .panel-title {
            width: 100%;
            padding-block: 4px;
            height: 120px;
        }

        .panel-title h1 {
            font-size: xx-large;
            font-weight: bold;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-items: end;
            gap: 40px;
        }

        /* response */
        #response {
            width: 90%;
            padding-inline: 20px;
            border-left: 2px solid #377771;
            height: calc(100vh - 260px);
            display: flex;
            flex-direction: column;
            align-items: start;
            gap: 10px;
            overflow-y: scroll;
        }

        #response .response-text-container {
            background-color: rgba(0, 0, 0, 0.434);
            border-radius: 80px;
            padding: 8px;
        }

        #response .text {
            font-size: 18px;
        }

        /* response */

        #chat-form {
            display: flex;
            align-items: start;
            gap: 16px;
            padding-inline: 20px;
            height: 120px;
        }

        #prompt-input {
            width: 100%;
            border-radius: 50px;
            background-color: rgba(0, 0, 0, 0.378);
            padding-inline: 16px;
            padding-block: 8px;
            color: white;
            font-weight: medium;
            border: none;
        }

        #prompt-input::placeholder {
            color: darkgrey;
        }

        #thinking {
            font-weight: bold;
            color: #ccc;
            display: none;
        }

        #ask-btn {
            height: 50px;
            width: 100px;
            border-radius: 50px;
            background-color: #ED6A5E;
            color: whitesmoke;
        }
    </style>
</head>

<body>
    <div class="panel-container">
        <div class="panel-title">
            <h1>Ask to Vito-AI</h2>
        </div>

        <div class="chat-container">
            <div id="response">
            </div>

            <form id="chat-form">
                <span id="thinking">Thinking... please wait</span>
                <textarea id="prompt-input" rows="2" placeholder="Ask something..."></textarea>
                <button type="submit" id="ask-btn">Ask</button>
            </form>
        </div>
    </div>


    <script>
        const vscode = acquireVsCodeApi(); // allows bidirectional communication between the webview and the extension's backend

        const chatForm = document.getElementById('chat-form')
        const promptInput = document.getElementById('prompt-input')
        const responseContainer = document.getElementById('response')


        chatForm.addEventListener('submit', (ev) => {
            ev.preventDefault()
            const text = promptInput.value;
            if (!text) return;
            vscode.postMessage({ command: 'prompt', text });
            promptInput.value = '';
        });

        window.addEventListener('message', event => {
            const message = event.data;
            if (message.command === 'prompt-response') {
                // document.getElementById('response').innerText = message.text;
                responseContainer.innerHTML += `<div class="response-text-container"><span class="text">${JSON.stringify(message)}</span></div>`
            }
            if (message.command === 'thinking') {
                if (message.state) {
                    document.getElementById('thinking').style.display = 'block';
                } else {
                    document.getElementById('thinking').style.display = 'none';
                }
            }
        });


    </script>
</body>

</html>
